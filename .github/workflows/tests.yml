name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        torch: [true, false]
    name: py${{ matrix.python }}${{ matrix.torch && ' + torch' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install optional CPU torch and numpy
        if: matrix.torch
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # Colab is never contacted: bridge tests use a fake upstream and a fake `colab` CLI.
      - name: Test
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest.log
      # Job logs need sign-in; annotations are public, so failing test names stay visible.
      - name: Annotate failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | sed 's/^/::error title=pytest::/' || true
          grep -E '^E   ' pytest.log | head -20 | sed 's/^/::error title=pytest detail::/' || true
