[project]
name = "lms-kernel"
version = "0.3.0"
description = "Student-side runtime helpers for the interactive deep learning LMS"
requires-python = ">=3.10"
dependencies = [
    "jupyter_server>=2.14",
    "ipykernel>=6.29",
    "packaging>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "requests>=2.31",
    "websocket-client>=1.7",
]

[project.scripts]
lms-runtime = "lms_kernel.launch:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung WebSocket/subprocess wait fails that test (with a traceback) instead of the CI job.
timeout = 300
