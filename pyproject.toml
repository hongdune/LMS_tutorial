[project]
name = "lms-kernel"
version = "0.1.0"
description = "Student-side runtime helpers for the interactive deep learning LMS"
requires-python = ">=3.10"
dependencies = [
    "jupyter_server>=2.14",
    "ipykernel>=6.29",
]

[project.scripts]
lms-runtime = "lms_kernel.launch:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
